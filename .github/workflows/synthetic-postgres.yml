name: Manual synthetic PostgreSQL verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Official library/postgres, PostgreSQL 17.11, Debian bookworm.
        # Immutable index resolved from the official registry before review.
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Temporary bootstrap only. The job replaces host trust with SCRAM,
          # disables postgres login, and generates fresh credentials before tests.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MC_SYN_CI_POSTGRES: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the manually selected ref
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, native node24
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0, native node24
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m venv "$RUNNER_TEMP/mc-syn-venv"
          "$RUNNER_TEMP/mc-syn-venv/bin/python" -m pip install --no-cache-dir -r requirements-dev.txt
          "$RUNNER_TEMP/mc-syn-venv/bin/python" -m pip check
      - name: Generate job-only credentials and secure disposable service
        env:
          MC_SYN_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: '"$RUNNER_TEMP/mc-syn-venv/bin/python" scripts/ci_postgres.py bootstrap'
      - name: Execute exactly 373 tests with all 167 PostgreSQL tests and zero skips
        run: '"$RUNNER_TEMP/mc-syn-venv/bin/python" scripts/ci_postgres.py verify'
      - name: Check diff whitespace
        run: git diff --check
      - name: Remove job-generated credential file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/mc-syn-postgres-credentials.json"
    # GitHub removes the job-owned service container when this job ends.
    # No artifacts, caches, deployments, repository/environment secrets, or uploads.
